name: Automatic Approve

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  automatic-approve:
    name: Automatic Approve
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve PRs
        run: |
          gh pr list --repo Saiaaax/CyberNinja-Dojo --state open --json number,mergeable,mergeStateStatus,reviewDecision --jq '.[] | select(.mergeable=="MERGEABLE" and .mergeStateStatus=="CLEAN" and .reviewDecision!=="APPROVED") | .number' | while read pr; do
            echo "Approving PR #$pr"
            gh pr review "$pr" --repo Saiaaax/CyberNinja-Dojo --approve --body "Auto-approved: CI clean, mergeable."
          done
